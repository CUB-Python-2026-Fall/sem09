[project]
name = "askboard"
version = "0.1.0"
description = "Seminar 9: AskBoard, a live Q&A board API (FastAPI + SQLite)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "jupyter>=1.1",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
